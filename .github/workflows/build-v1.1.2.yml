name: Build QVTF Author v1.1.2 Draft Release

on:
  push:
    branches: [release-build-v1.1.2]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v1.1.2 tag on main
        run: |
          git fetch origin main --tags
          MAIN_SHA=$(git rev-parse origin/main)
          if git rev-parse -q --verify refs/tags/v1.1.2 >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 v1.1.2)
            test "$TAG_SHA" = "$MAIN_SHA"
          else
            git tag v1.1.2 "$MAIN_SHA"
            git push origin refs/tags/v1.1.2
          fi

  release:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: node --check src/main.js
      - name: Build and attach draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.1.2
          releaseName: 'QVTF Author v1.1.2'
          releaseBody: |
            QVTF Author 1.1.2 release candidate.

            Fixes Windows helper-process console popups, adds ARM64-aware MiKTeX discovery, and cleans British-English spelling mappings.

            The macOS build is not Apple-notarized and the Windows build is not code-signed. Download only from the official QVTF Author repository and verify the published checksums.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: release
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download draft release assets
        run: |
          mkdir release-assets
          gh release download v1.1.2 --repo "${GITHUB_REPOSITORY}" --dir release-assets
      - name: Generate and upload SHA-256 manifest
        run: |
          cd release-assets
          sha256sum * > QVTF_Author_v1.1.2_SHA256.txt
          gh release upload v1.1.2 QVTF_Author_v1.1.2_SHA256.txt --repo "${GITHUB_REPOSITORY}" --clobber

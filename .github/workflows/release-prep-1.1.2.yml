name: Prepare QVTF Author 1.1.2

on:
  push:
    branches: [qvtf-author-1.1.2-cleanup]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-prepared]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version 1.1.2
        run: |
          npm version 1.1.2 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          s = p.read_text()
          s = s.replace('"version": "1.1.1"', '"version": "1.1.2"', 1)
          p.write_text(s)
          p = Path('src-tauri/Cargo.toml')
          s = p.read_text()
          s = s.replace('version = "1.1.1"', 'version = "1.1.2"', 1)
          p.write_text(s)
          PY
          cargo check --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: release-prepared-files
          path: |
            package.json
            package-lock.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-prepared-files
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: node --check src/main.js
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  commit:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qvtf-author-1.1.2-cleanup
      - uses: actions/download-artifact@v4
        with:
          name: release-prepared-files
          path: .
      - name: Commit validated release metadata
        run: |
          rm -f .github/workflows/release-prep-1.1.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare QVTF Author 1.1.2 release [release-prepared]"
          git push origin HEAD:qvtf-author-1.1.2-cleanup

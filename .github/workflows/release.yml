name: Release Multi-Platform Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check frontend JavaScript
        run: node --check src/main.js

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QVTF Author ${{ github.ref_name }}'
          releaseBody: |
            Multi-platform QVTF Author release.

            The macOS build is not Apple-notarized and the Windows build is not code-signed. Download only from the official QVTF Author repository and verify the published checksums.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Publish release checksums
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download draft release assets
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Generate and upload SHA-256 manifest
        shell: bash
        run: |
          cd release-assets
          rm -f "QVTF_Author_${GITHUB_REF_NAME}_SHA256.txt"
          sha256sum * > "QVTF_Author_${GITHUB_REF_NAME}_SHA256.txt"
          gh release upload "${GITHUB_REF_NAME}" "QVTF_Author_${GITHUB_REF_NAME}_SHA256.txt" --repo "${GITHUB_REPOSITORY}" --clobber
